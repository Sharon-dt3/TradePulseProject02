[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is intentionally NOT set here. env.py reads the direct
# (unpooled) Supabase connection string from the ALEMBIC_DATABASE_URL
# environment variable at runtime — never DATABASE_URL (that's the pooled
# string reserved for application traffic, per BLUEPRINT.md §5).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
