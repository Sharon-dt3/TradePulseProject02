# Phase 0: Supabase connection wiring for ledger-core.
#
# Two distinct connection strings, per BLUEPRINT.md §5:
#   - SPRING_DATASOURCE_URL: Supavisor pooled (transaction mode), port 6543.
#     Used by all application/runtime traffic (JPA/Hibernate, HikariCP).
#   - SPRING_FLYWAY_URL: direct/unpooled connection, port 5432.
#     Used ONLY by Flyway to run migrations. Never used by app traffic.
#
# Both are Supabase connection strings for the tradePulseProject instance
# (project ref psbxribzhqycoogqeiuh, region us-east-1) — see your Supabase
# dashboard: Project Settings -> Database -> Connection string, for both the
# "Transaction pooler" (Supavisor, 6543) and "Direct connection" (5432)
# variants. Never commit the actual values — they come from environment
# variables / a local .env, which .gitignore already excludes.

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://psbxribzhqycoogqeiuh.supabase.co/auth/v1/.well-known/jwks.json
          issuer-uri: https://psbxribzhqycoogqeiuh.supabase.co/auth/v1
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Phase 0 checklist item: test Supavisor transaction-mode pooling
      # against HikariCP/JDBC prepared-statement caching; disable caching
      # here if it misbehaves under the pooler.
      # Phase 3: Supavisor's transaction-mode pooler (port 6543) closes
      # idle physical connections more aggressively than Hikari's default
      # maxLifetime (30 min) expects, which OutboxRelay's once-a-second
      # polling now surfaces as periodic connection has been closed
      # warnings. Set below Supavisor's own timeout so Hikari recycles
      # connections proactively instead of reactively.
      max-lifetime: 30000
      data-source-properties:
        prepareThreshold: 0
        cachePrepStmts: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    url: ${SPRING_FLYWAY_URL}
    user: ${SPRING_FLYWAY_USERNAME:postgres}
    password: ${SPRING_FLYWAY_PASSWORD}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Phase 3: TradePulse-specific settings, namespaced under "ledger" so they
# read as our own domain config rather than a Spring Boot built-in.
ledger:
  market-data:
    stream-name: market.ticks
    consumer-group: cg:ledger-core
  outbox:
    stream-name: ledger.events
    relay-interval-ms: 1000
  # OrderServiceImpl's MARKET fill staleness check (STALE_PRICE). Both
  # tools/tick-producer scripts tick once a second per symbol, so 5x that
  # interval tolerates one or two missed/delayed ticks without treating a
  # merely-slow feed the same as a genuinely dead one.
  max-price-age-ms: 5000
  max-position-notional: ${LEDGER_MAX_POSITION_NOTIONAL:50000}
  # Phase 6: commission rate in basis points (1 bps = 0.01%), applied to a
  # fill's notional (quantity x price) to compute the fee. 10 bps = 0.10%.
  # Env-overridable like max-position-notional, since a commission rate is
  # the kind of business parameter that plausibly differs per deployment.
  commission-bps: ${LEDGER_COMMISSION_BPS:10}
  # Phase 6: the house account fees are credited to, seeded by
  # V14__house_fees_account.sql. Hardcoded (not env-overridable) on
  # purpose — this value and the migration's seeded row must always match
  # exactly, so letting them drift apart via an env var would just create
  # a way for the two to disagree.
  house-account-id: a0000000-0000-4000-8000-000000000002
  # Phase 8: how long a LIMIT order stays WORKING when the client
  # doesn't supply its own expiresAt (OrderRequestDto.expiresAt is
  # optional). The scheduled sweep (next step) marks anything past this
  # EXPIRED. Env-overridable for the same reason commission-bps is.
  limit-order-default-ttl-hours: ${LEDGER_LIMIT_ORDER_DEFAULT_TTL_HOURS:24}
  # Phase 8: how often OrderExpirySweep checks for WORKING orders whose
  # expires_at has passed. Minute-scale is plenty - unlike price ticks,
  # an order's expiry is measured in hours (see the default TTL above),
  # so a client won't notice a sweep running once a minute rather than
  # once a second.
  limit-order-expiry-sweep-interval-ms: ${LEDGER_LIMIT_ORDER_EXPIRY_SWEEP_INTERVAL_MS:60000}
  cors:
    allowed-origins: ${LEDGER_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Phase 10: SSE stream ticket issuance. EventSource can't set headers,
  # so raw JWTs never go in the SSE URL - ledger-core issues a short-
  # lived, single-use opaque ticket instead (BLUEPRINT.md's "SSE auth").
  # 30s is deliberately short: a ticket only needs to survive the gap
  # between this REST call returning and the client immediately opening
  # EventSource with it, not the SSE connection's own lifetime.
  sse:
    ticket-ttl-seconds: ${LEDGER_SSE_TICKET_TTL_SECONDS:30}
  # Phase 9: server-side statement generation (StatementService) and
  # Supabase Storage upload for the private "statements" bucket.
  # service-role key is required because ledger-core uploads via the
  # Storage HTTP API, which enforces Storage RLS unless bypassed by
  # service_role - same reasoning as ledger-core's own Postgres
  # connection bypassing table RLS.
  statements:
    supabase-url: ${SUPABASE_URL}
    supabase-service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
    retention-years: ${LEDGER_STATEMENTS_RETENTION_YEARS:7}
    # How often StatementRetentionJob checks for statement objects past
    # retention-years. Year-scale retention doesn't need minute-scale
    # polling like the LIMIT order expiry sweep - daily is plenty, and
    # still env-overridable for testing (a short interval to verify the
    # sweep without waiting years for a real object to age out).
    retention-sweep-interval-ms: ${LEDGER_STATEMENTS_RETENTION_SWEEP_INTERVAL_MS:86400000}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
